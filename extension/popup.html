<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>PromptLens</title>
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><circle cx="12" cy="11" r="2.4"/><path d="M12 13.4V16"/></svg>
      </span>
      <div>
        <div class="brand-name">PromptLens</div>
        <div class="brand-sub">PII Guard for AI prompts</div>
      </div>
    </div>
    <label class="switch" title="Toggle protection">
      <input type="checkbox" id="enabled" checked />
      <span class="slider"></span>
      <span class="sr-only">Enable protection</span>
    </label>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="stat-num" id="st-today">0</div>
      <div class="stat-label">PII flagged today</div>
    </div>
    <div class="stat">
      <div class="stat-num stat-green" id="st-masked">0</div>
      <div class="stat-label">Masked (all time)</div>
    </div>
    <div class="stat">
      <div class="stat-num stat-red" id="st-leaked">0</div>
      <div class="stat-label">Sent unmasked</div>
    </div>
  </section>

  <section class="types" id="types"></section>

  <section class="privacy-row" title="PromptLens has no server, no account and no telemetry">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>100% local — nothing leaves this device</span>
  </section>

  <footer class="actions">
    <button class="btn btn-primary" id="btn-local">Open Dashboard</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
